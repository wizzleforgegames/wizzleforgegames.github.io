<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Оплата прошла — Wizzle Forge Games</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="pay.css"></head>
<body class="ok"><div class="box">
<div class="mark">✓</div><h1>Оплата прошла</h1>
<p>Спасибо за покупку! Награды появятся в игре в течение минуты.</p>
<table id="kv"></table>
<a class="btn" href="/">Играть дальше</a>
<small>Wizzle Forge Games</small>
</div>
<script>
(function(){var q=new URLSearchParams(location.search),o={};q.forEach(function(v,k){o[k]=v});
try{localStorage.setItem('wz_pay',JSON.stringify({t:Date.now(),ok:true,q:o}));}catch(e){}
var t=document.getElementById('kv');
['InvId','OutSum','PaymentMethod'].forEach(function(k){if(o[k]===undefined)return;var tr=document.createElement('tr');tr.innerHTML='<td>'+k+'</td><td>'+String(o[k]).slice(0,80)+'</td>';t.appendChild(tr)});
try{if(window.parent&&window.parent!==window)window.parent.postMessage({wzpay:true,q:o},'*');}catch(e){}})();
</script></body></html>
